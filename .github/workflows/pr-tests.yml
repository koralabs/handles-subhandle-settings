name: PR Unit Tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  unit:
    name: Lint, build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          always-auth: true
          scope: '@koralabs'
      - run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npm test
